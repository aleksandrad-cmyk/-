                    { text: "Синкаться с креативной командой по TikTok (Настя Щербань, Оля Курашова), узнать, когда выходят видео от креаторов", status: "текущая", forLuba: false },
                    { text: "Креативная команда: Совместно определить ТЗ для TikTok (решать на ходу)", status: "подвижная", forLuba: false },
                    { text: "Настя Колотий: Запустить TikTok (когда будут готовы видео от креаторов)", status: "после готовности", forLuba: false }
                ],
                payments: [],
                critical: [
                    { text: "Важно: При согласованиях ТЗ обязательно тегать обоих — Сережу И Дениса (оба должны быть включены)", status: "важно", forLuba: false },
                    { text: "Meta: Запускаем только когда в Instagram будет минимум 9 постов", status: "условие запуска", forLuba: false },
                    { text: "TikTok: Запускаем только когда будут видео от креаторов", status: "условие запуска", forLuba: false },
                    { text: "Ангелина передала дела Оле Курашовой — теперь Оля будет прод. креативной команды", status: "инфо", forLuba: false }
                ]
            }
        };

        let currentProject = null;

        function initProjects() {
            const projectList = document.getElementById('projectList');
            
            Object.keys(projects).forEach((key, index) => {
                const li = document.createElement('li');
                li.className = 'project-item';
                li.textContent = projects[key].name;
                li.onclick = () => selectProject(key);
                projectList.appendChild(li);
            });

            document.getElementById('nav-luiba').onclick = () => showLubaTasks();
            
            selectProject(Object.keys(projects)[0]);
        }

        function selectProject(key) {
            currentProject = key;
            const project = projects[key];

            document.getElementById('projectName').textContent = project.name;
            document.getElementById('projectClient').textContent = `${project.client}`;

            document.querySelectorAll('.project-item').forEach((item) => {
                item.classList.remove('active');
            });
            document.querySelectorAll(`[onclick*="${key}"]`).forEach(item => item.classList.add('active'));

            renderContent(project);
        }

        function renderContent(project) {
            const contentBody = document.getElementById('contentBody');
            contentBody.innerHTML = '';

            const infoDiv = document.createElement('div');
            infoDiv.className = 'project-info';
            infoDiv.innerHTML = `
                <strong>👥 Команда:</strong> ${project.team}
                <strong>🌐 Сайты:</strong> ${project.sites}
            `;
            contentBody.appendChild(infoDiv);

            // КОНТЕКСТ ПРОЕКТА
            if (project.context && project.context.length > 0) {
                const contextDiv = document.createElement('div');
                contextDiv.className = 'section context';
                
                const contextTitle = document.createElement('h2');
                contextTitle.textContent = '📌 Контекст проекта';
                contextDiv.appendChild(contextTitle);
                
                const contextList = document.createElement('ul');
                contextList.className = 'context-list';
                
                project.context.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    contextList.appendChild(li);
                });
                
                contextDiv.appendChild(contextList);
                contentBody.appendChild(contextDiv);
            }

            // МАТЕРИАЛЫ
            if (project.materials && project.materials.length > 0) {
                const materialsDiv = document.createElement('div');
                materialsDiv.className = 'section';
                materialsDiv.style.borderLeftColor = '#3498db';
                
                const materialsTitle = document.createElement('h2');
                materialsTitle.textContent = '📎 Материалы';
                materialsDiv.appendChild(materialsTitle);
                
                const materialsList = document.createElement('ul');
                materialsList.className = 'materials-list';
                
                project.materials.forEach(material => {
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = material.url;
                    link.textContent = material.title;
                    link.target = '_blank';
                    li.appendChild(link);
                    materialsList.appendChild(li);
                });
                
                materialsDiv.appendChild(materialsList);
                contentBody.appendChild(materialsDiv);
            }

            if (project.documents.length > 0) {
                const section = createSection('📄 Документы', 'documents', project.documents, 'documents');
                contentBody.appendChild(section);
            }

            if (project.statuses.length > 0) {
                const section = createSection('✅ Статусы и планы', 'statuses', project.statuses, 'statuses');
                contentBody.appendChild(section);
            }

            if (project.payments.length > 0) {
                const section = createSection('💰 Платежи', 'payments', project.payments, 'payments');
                contentBody.appendChild(section);
            }

            if (project.critical.length > 0) {
                const section = createSection('🔴 Критические задачи', 'critical', project.critical, 'critical');
                contentBody.appendChild(section);
            }

            // ЗАМЕТКИ ЛЮБЫ
            const notesDiv = document.createElement('div');
            notesDiv.className = 'section notes';
            
            const notesTitle = document.createElement('h2');
            notesTitle.textContent = '📝 Заметки Любы';
            notesDiv.appendChild(notesTitle);
            
            const notesTextarea = document.createElement('textarea');
            notesTextarea.className = 'notes-textarea';
            notesTextarea.placeholder = 'Пишите здесь обновления, пометки о выполнении задач, комментарии...';
            notesTextarea.id = `notes-${currentProject}`;
            
            // Загружаем сохраненные заметки
            const savedNotes = localStorage.getItem(`notes-${currentProject}`);
            if (savedNotes) {
                notesTextarea.value = savedNotes;
            }
            
            // Автосохранение при изменении
            notesTextarea.addEventListener('input', () => {
                localStorage.setItem(`notes-${currentProject}`, notesTextarea.value);
            });
            
            notesDiv.appendChild(notesTextarea);
            contentBody.appendChild(notesDiv);
        }

        function createSection(title, type, tasks, sectionClass) {
            const section = document.createElement('div');
            section.className = `section ${sectionClass}`;

            const header = document.createElement('h2');
            header.textContent = title;
            section.appendChild(header);

            if (tasks.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'section-empty';
                empty.textContent = 'Нет задач';
                section.appendChild(empty);
            } else {
                tasks.forEach((task, index) => {
                    const taskItem = document.createElement('div');
                    taskItem.className = task.forLuba ? 'task-item for-luba' : 'task-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'task-checkbox';
                    checkbox.id = `${currentProject}-${type}-${index}`;

                    checkbox.onchange = () => {
                        taskItem.classList.toggle('completed');
                        saveProgress();
                    };

                    const contentWrapper = document.createElement('div');
                    contentWrapper.style.flex = '1';

                    const text = document.createElement('div');
                    text.className = 'task-text';
                    
                    if (task.forLuba) {
                        const badge = document.createElement('span');
                        badge.className = 'luba-badge';
                        badge.textContent = '👤 Люба';
                        text.appendChild(badge);
                        
                        const textNode = document.createElement('span');
                        textNode.textContent = task.text;
                        text.appendChild(textNode);
                    } else {
                        text.textContent = task.text;
                    }

                    contentWrapper.appendChild(text);

                    if (task.deadline) {
                        const deadlineBadge = document.createElement('div');
                        deadlineBadge.className = 'deadline-badge';
                        deadlineBadge.textContent = `⏰ ${task.deadline}`;
                        contentWrapper.appendChild(deadlineBadge);
                    }

                    taskItem.appendChild(checkbox);
                    taskItem.appendChild(contentWrapper);

                    const status = document.createElement('div');
                    status.className = 'task-status';
                    status.textContent = task.status;
                    taskItem.appendChild(status);

                    section.appendChild(taskItem);
                });
            }

            return section;
        }

        function saveProgress() {
            const progress = {};
            document.querySelectorAll('.task-checkbox:checked').forEach(checkbox => {
                progress[checkbox.id] = true;
            });
            localStorage.setItem('handover_progress', JSON.stringify(progress));
        }

        function loadProgress() {
            const progress = JSON.parse(localStorage.getItem('handover_progress') || '{}');
            Object.keys(progress).forEach(id => {
                const checkbox = document.getElementById(id);
                if (checkbox) {
                    checkbox.checked = true;
                    checkbox.closest('.task-item').classList.add('completed');
                }
            });
        }

        initProjects();
        loadProgress();
    </script>
</body>
</html>
