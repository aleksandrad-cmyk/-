                    { title: "МП (Библиотека Лань & Nimax | Медиаплан)", url: "#" },
                    { title: "Отчет (Библиотека Лань & Nimax | Отчет)", url: "#" },
                    { title: "Таблица с лидами (заполняет клиент)", url: "https://docs.google.com/spreadsheets/d/1YQRBw6u80WrsT5h2zXRB34y1o8ocVmNWJoUhPrpFMsY/edit?gid=0#gid=0" },
                    { title: "Задача в коллаб (статусы специалистов)", url: "https://collab.nimax.ru/projects/1312/tasks/131352" }
                ],
                documents: [
                    { text: "Счет на бюджет — выставлю после согласования медиаплана", status: "после согласования", forLuba: false },
                    { text: "Счет на обслуживание — выставлю после согласования медиаплана", status: "после согласования", forLuba: false }
                ],
                statuses: [
                    { text: "Еженедельно отправлять статусы с отчетностью из Колаба в чат", status: "еженедельно", forLuba: true, deadline: "каждую неделю" },
                    { text: "Таблица с лидами (заполняет клиент) → забрать статистику из коллаба → отправить клиенту", status: "процесс", forLuba: true, deadline: "по факту" },
                    { text: "Согласовать медиаплан на следующий месяц (встреча с Сашей)", status: "к согласованию", forLuba: false }
                ],
                payments: [
                    { text: "Люба: Получить авансы на бюджет и обслуживание", status: "ожидание", forLuba: true },
                    { text: "Люба: Пополнить кабинет на следующий месяц", status: "после получения", forLuba: true }
                ],
                critical: [
                    { text: "Люба: Отчитаться за сентябрь вместе со специалистом на встрече", status: "к выполнению", forLuba: true, deadline: "на встречу" },
                    { text: "Люба: Передать статистику и отчет клиенту после встречи", status: "после встречи", forLuba: true }
                ]
            },
            baush: {
                name: "Бауш Ultralinzi (GEO)",
                client: "Дарья Барабанова (Daria.Barabanova@bausch.com) — уходит в декрет 20-х чисел, НОВОЕ контактное лицо — Светлана Безруких (@lanabezrukih, Svetlana.Bezrukih@bausch.com)",
                team: "SEO — Аня Поздняк + Настя Черкунова, Документы — Светлана Санкевич",
                sites: "#",
                materials: [
                    { title: "Старая смета", url: "https://docs.google.com/spreadsheets/d/1IY33ascamKRy10mut63Id6Y62L5mQpSNAN4HuwP5WJw/edit?gid=1124043236#gid=1124043236" },
                    { title: "Презентация новой стратегии", url: "https://docs.google.com/presentation/d/1YJO16GEsZINENCJx-NWlDhkVsMtDjdoB7ATWGqWxa8w/edit?slide=id.p1#slide=id.p1" }
                ],
                documents: [
                    { text: "Светлана Санкевич: Подготовить документы по новой стратегии", status: "в процессе", forLuba: false },
                    { text: "Смета остаётся в рамках предыдущей сметы", status: "согласовано", forLuba: false }
                ],
                statuses: [
                    { text: "Дорабатываем измененную стратегию глобально под бренд, а не под отдельный сайт", status: "в процессе", forLuba: false },
                    { text: "Люба: Получить согласование работ на октябрь от клиента (Светлана Безруких)", status: "ожидание", forLuba: true, deadline: "СРОЧНО" },
                    { text: "После согласования: распланировать старт работ на октябрь", status: "к выполнению", forLuba: false, deadline: "после согласования" }
                ],
                payments: [
                    { text: "Получить авансы в рамках предыдущей сметы", status: "по мере", forLuba: false }
                ],
                critical: [
                    { text: "ВАЖНО: Смена контактного лица — Дарья уходит в декрет, основной контакт теперь Светлана Безруких", status: "важно", forLuba: false },
                    { text: "Люба: Передать всю информацию новому контактному лицу Светлане Безруких", status: "к выполнению", forLuba: true, deadline: "АСАП" },
                    { text: "Аня Поздняк + Настя Черкунова: Согласовать новую стратегию с клиентом", status: "в процессе", forLuba: false }
                ]
            }
        };

        let currentProject = null;
        let lubaTasksList = [];

        function initProjects() {
            const projectList = document.getElementById('projectList');
            
            // Добавляем проекты
            Object.keys(projects).forEach((key, index) => {
                const li = document.createElement('li');
                li.className = 'project-item';
                li.textContent = projects[key].name;
                li.onclick = () => selectProject(key);
                projectList.appendChild(li);
            });

            // Событие на кнопку "Задачи для Любы"
            document.getElementById('nav-luiba').onclick = () => showLubaTasks();
            
            selectProject(Object.keys(projects)[0]);
        }

        function selectProject(key) {
            currentProject = key;
            const project = projects[key];

            document.getElementById('projectName').textContent = project.name;
            document.getElementById('projectClient').textContent = `${project.client}`;

            document.querySelectorAll('.project-item').forEach((item) => {
                item.classList.remove('active');
            });
            document.querySelectorAll(`[onclick*="${key}"]`).forEach(item => item.classList.add('active'));

            renderContent(project);
        }

        function showLubaTasks() {
            currentProject = null;
            document.getElementById('projectName').textContent = '📝 Задачи для Любы';
            document.getElementById('projectClient').textContent = 'Менеджер-замена: Люба';

            document.querySelectorAll('.project-item').forEach((item) => {
                item.classList.remove('active');
            });
            document.getElementById('nav-luiba').classList.add('active');

            renderLubaTasks();
        }

        function renderContent(project) {
            const contentBody = document.getElementById('contentBody');
            contentBody.innerHTML = '';

            const infoDiv = document.createElement('div');
            infoDiv.className = 'project-info';
            infoDiv.innerHTML = `
                <strong>👥 Команда:</strong> ${project.team}
                <strong>🌐 Сайты:</strong> ${project.sites}
            `;
            
            // Добавляем материалы если они есть
            if (project.materials && project.materials.length > 0) {
                const materialsSection = document.createElement('div');
                materialsSection.style.marginTop = '12px';
                materialsSection.style.paddingTop = '12px';
                materialsSection.style.borderTop = '1px solid #e0e0e0';
                
                const materialsTitle = document.createElement('strong');
                materialsTitle.textContent = '📎 Материалы:';
                materialsTitle.style.display = 'block';
                materialsTitle.style.marginBottom = '8px';
                materialsSection.appendChild(materialsTitle);
                
                const materialsList = document.createElement('ul');
                materialsList.className = 'materials-list';
                
                project.materials.forEach(material => {
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = material.url;
                    link.textContent = material.title;
                    link.target = '_blank';
                    li.appendChild(link);
                    materialsList.appendChild(li);
                });
                
                materialsSection.appendChild(materialsList);
                infoDiv.appendChild(materialsSection);
            }
            
            contentBody.appendChild(infoDiv);

            // КОНТЕКСТ ПРОЕКТА
            if (project.context && project.context.length > 0) {
                const contextDiv = document.createElement('div');
                contextDiv.className = 'context-section';
                
                const contextTitle = document.createElement('h3');
                contextTitle.textContent = '📌 Контекст проекта';
                contextDiv.appendChild(contextTitle);
                
                const contextList = document.createElement('ul');
                contextList.className = 'context-list';
                
                project.context.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    contextList.appendChild(li);
                });
                
                contextDiv.appendChild(contextList);
                contentBody.appendChild(contextDiv);
            }

            if (project.documents.length > 0) {
                const section = createSection('📄 Документы', 'documents', project.documents, 'documents');
                contentBody.appendChild(section);
            }

            if (project.statuses.length > 0) {
                const section = createSection('📊 Регулярные статусы', 'statuses', project.statuses, 'statuses');
                contentBody.appendChild(section);
            }

            if (project.payments.length > 0) {
                const section = createSection('💰 Оплаты к получению', 'payments', project.payments, 'payments');
                contentBody.appendChild(section);
            }

            if (project.critical.length > 0) {
                const section = createSection('🔴 Критические задачи', 'critical', project.critical, 'critical');
                contentBody.appendChild(section);
            }

            if (!project.documents.length && !project.statuses.length && !project.payments.length && !project.critical.length) {
                const empty = document.createElement('div');
                empty.className = 'section-empty';
                empty.textContent = 'Для этого проекта нет задач';
                contentBody.appendChild(empty);
            }
        }

        function renderLubaTasks() {
            const contentBody = document.getElementById('contentBody');
            contentBody.innerHTML = '';

            // Собираем все задачи для Любы из всех проектов
            const allLubaTasks = [];
            Object.keys(projects).forEach(projectKey => {
                const project = projects[projectKey];
                
                // Документы
                project.documents.forEach((task, index) => {
                    if (task.forLuba) {
                        allLubaTasks.push({
                            project: project.name,
                            text: task.text,
                            status: task.status,
                            deadline: task.deadline,
                            type: 'documents',
                            id: `${projectKey}-documents-${index}`
                        });
                    }
                });

                // Статусы
                project.statuses.forEach((task, index) => {
                    if (task.forLuba) {
                        allLubaTasks.push({
                            project: project.name,
                            text: task.text,
                            status: task.status,
                            deadline: task.deadline,
                            type: 'statuses',
                            id: `${projectKey}-statuses-${index}`
                        });
                    }
                });

                // Оплаты
                project.payments.forEach((task, index) => {
                    if (task.forLuba) {
                        allLubaTasks.push({
                            project: project.name,
                            text: task.text,
                            status: task.status,
                            deadline: task.deadline,
                            type: 'payments',
                            id: `${projectKey}-payments-${index}`
                        });
                    }
                });

                // Критические задачи
                project.critical.forEach((task, index) => {
                    if (task.forLuba) {
                        allLubaTasks.push({
                            project: project.name,
                            text: task.text,
                            status: task.status,
                            deadline: task.deadline,
                            type: 'critical',
                            id: `${projectKey}-critical-${index}`
                        });
                    }
                });
            });

            if (allLubaTasks.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.innerHTML = '<p>🎉 Все критические задачи выполнены!</p>';
                contentBody.appendChild(empty);
                return;
            }

            // Группируем по проектам
            const tasksByProject = {};
            allLubaTasks.forEach(task => {
                if (!tasksByProject[task.project]) {
                    tasksByProject[task.project] = [];
                }
                tasksByProject[task.project].push(task);
            });

            // Выводим задачи по проектам
            Object.keys(tasksByProject).forEach(projectName => {
                const section = document.createElement('div');
                section.className = 'section critical';

                const header = document.createElement('h2');
                header.textContent = `📌 ${projectName}`;
                section.appendChild(header);

                tasksByProject[projectName].forEach((task) => {
                    const taskItem = document.createElement('div');
                    taskItem.className = 'task-item for-luba';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'task-checkbox';
                    checkbox.id = `luba-${task.id}`;

                    checkbox.onchange = () => {
                        taskItem.classList.toggle('completed');
                        saveProgress();
                    };

                    const contentWrapper = document.createElement('div');
                    contentWrapper.style.flex = '1';

                    const text = document.createElement('div');
                    text.className = 'task-text';
                    
                    const badge = document.createElement('span');
                    badge.className = 'luba-badge';
                    badge.textContent = '👤 Сделать Любе';
                    text.appendChild(badge);
                    
                    const textNode = document.createElement('span');
                    textNode.textContent = task.text;
                    text.appendChild(textNode);

                    contentWrapper.appendChild(text);

                    if (task.deadline) {
                        const deadlineBadge = document.createElement('div');
                        deadlineBadge.className = 'deadline-badge';
                        deadlineBadge.textContent = `⏰ Дедлайн: ${task.deadline}`;
                        contentWrapper.appendChild(deadlineBadge);
                    }

                    taskItem.appendChild(checkbox);
                    taskItem.appendChild(contentWrapper);

                    const statusBadge = document.createElement('div');
                    statusBadge.className = 'task-status';
                    statusBadge.textContent = task.status;
                    taskItem.appendChild(statusBadge);

                    section.appendChild(taskItem);
                });

                contentBody.appendChild(section);
            });
        }

        function createSection(title, type, tasks, sectionClass) {
            const section = document.createElement('div');
            section.className = `section ${sectionClass}`;

            const header = document.createElement('h2');
            header.textContent = title;
            section.appendChild(header);

            if (tasks.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'section-empty';
                empty.textContent = 'Нет задач';
                section.appendChild(empty);
            } else {
                tasks.forEach((task, index) => {
                    const taskItem = document.createElement('div');
                    taskItem.className = task.forLuba ? 'task-item for-luba' : 'task-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'task-checkbox';
                    checkbox.id = `${currentProject}-${type}-${index}`;

                    checkbox.onchange = () => {
                        taskItem.classList.toggle('completed');
                        saveProgress();
                    };

                    const contentWrapper = document.createElement('div');
                    contentWrapper.style.flex = '1';

                    const text = document.createElement('div');
                    text.className = 'task-text';
                    
                    if (task.forLuba) {
                        const badge = document.createElement('span');
                        badge.className = 'luba-badge';
                        badge.textContent = '👤 Сделать Любе';
                        text.appendChild(badge);
                        
                        const textNode = document.createElement('span');
                        textNode.textContent = task.text;
                        text.appendChild(textNode);
                    } else {
                        text.textContent = task.text;
                    }

                    contentWrapper.appendChild(text);

                    if (task.deadline) {
                        const deadlineBadge = document.createElement('div');
                        deadlineBadge.className = 'deadline-badge';
                        deadlineBadge.textContent = `⏰ Дедлайн: ${task.deadline}`;
                        contentWrapper.appendChild(deadlineBadge);
                    }

                    taskItem.appendChild(checkbox);
                    taskItem.appendChild(contentWrapper);

                    const status = document.createElement('div');
                    status.className = 'task-status';
                    status.textContent = task.status;
                    taskItem.appendChild(status);

                    section.appendChild(taskItem);
                });
            }

            return section;
        }

        function saveProgress() {
            const progress = {};
            document.querySelectorAll('.task-checkbox:checked').forEach(checkbox => {
                progress[checkbox.id] = true;
            });
            localStorage.setItem('handover_progress', JSON.stringify(progress));
        }

        function loadProgress() {
            const progress = JSON.parse(localStorage.getItem('handover_progress') || '{}');
            Object.keys(progress).forEach(id => {
                const checkbox = document.getElementById(id);
                if (checkbox) {
                    checkbox.checked = true;
                    checkbox.closest('.task-item').classList.add('completed');
                }
            });
        }

        initProjects();
        loadProgress();
        
        // Загружаем прогресс Любы при открытии её списка
        document.addEventListener('click', (e) => {
            if (e.target.id === 'nav-luiba') {
                setTimeout(loadProgress, 100);
            }
        });
    </script>
</body>
</html>
